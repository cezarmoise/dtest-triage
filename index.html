<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dtest triage</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #777; }
  .row { display: grid; grid-template-columns: 1fr repeat(5, 64px); align-items: center; gap: 4px; }
  .row > span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .head { font-weight: 600; padding: 4px 8px 4px 24px; border-bottom: 2px solid #ccc; }
  details { border-bottom: 1px solid #eee; }
  summary { cursor: pointer; padding: 4px 8px; list-style-position: outside; }
  summary .row { display: inline-grid; width: calc(100% - 20px); }
  details details { margin-left: 20px; }
  .G { color: #1a7f37; } .Y { color: #9a6700; } .R { color: #cf222e; } .X { color: #888; }
  .badge { display: inline-block; min-width: 56px; text-align: center; border-radius: 4px; padding: 0 4px;
           font-size: 12px; font-weight: 600; color: #fff; margin-right: 6px; }
  .bG { background: #1a7f37; } .bY { background: #bf8700; } .bR { background: #cf222e; } .bX { background: #999; }
  .test { padding: 8px 8px 12px 28px; max-width: 1100px; }
  .test p { margin: 4px 0; }
  table { border-collapse: collapse; margin: 4px 0; }
  td, th { padding: 2px 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  code { font-size: 12px; }
  .stats { margin-left: 8px; font-size: 12px; }
</style>
</head>
<body>
<h1>dtest triage</h1>
<div class="muted" id="meta">loading…</div>
<div class="row head"><span>File / class / test</span><span class="G">GREEN</span><span class="Y">YELLOW</span>
  <span class="R">RED</span><span class="X">GRAY</span><span>total</span></div>
<div id="root"></div>
<script>
const BASE = new URLSearchParams(location.search).get("base") || ".";
const DTEST = "https://github.com/scylladb/scylla-dtest";
const COLORS = { GREEN: "G", YELLOW: "Y", RED: "R" };

const getJSON = async (path) => {
  const r = await fetch(`${BASE}/${path}`, { cache: "no-cache" });
  return r.ok ? r.json() : null;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const fmtS = (s) => (s >= 60 ? `${(s / 60).toFixed(1)}m` : `${s.toFixed(0)}s`);

function counts(tests) {
  const c = { G: 0, Y: 0, R: 0, X: 0 };
  tests.forEach((t) => c[t.color]++);
  return c;
}
const countCells = (c, n) => `<span class="G">${c.G || ""}</span><span class="Y">${c.Y || ""}</span>` +
  `<span class="R">${c.R || ""}</span><span class="X">${c.X || ""}</span><span>${n}</span>`;

function commitRow(c, summary) {
  const pr = c.pr ? `<a href="${DTEST}/pull/${c.pr.number}">#${c.pr.number}</a>` : "";
  return `<tr><td class="n">${esc(c.date)}</td><td><a href="${DTEST}/commit/${c.sha}"><code>${c.sha.slice(0, 8)}</code></a></td>` +
    `<td>${pr}</td><td>${esc(summary || c.subject)}${summary ? `<div class="muted">${esc(c.subject)} — ${esc(c.author)}</div>` : ` <span class="muted">— ${esc(c.author)}</span>`}</td></tr>`;
}

function testBody(t, fileCommits) {
  const a = t.analysis || {};
  const sums = a.commits || {};
  const fnShas = new Set(t.commits.map((c) => c.sha));
  const byPrefix = (sha) => Object.entries(sums).find(([k]) => sha.startsWith(k) || k.startsWith(sha))?.[1];
  const extra = fileCommits.filter((c) => !fnShas.has(c.sha) && byPrefix(c.sha));
  const parts = [];
  if (t.override) parts.push(`<p><b>Override:</b> ${esc(t.override.decision)} — ${esc(t.override.note)} <span class="muted">${esc(t.override.by)}</span></p>`);
  if (a.description) parts.push(`<p><b>Description:</b> ${esc(a.description)}</p>`);
  if (a.reason) parts.push(`<p><b>Reason:</b> ${esc(a.reason)}</p>`);
  if (a.relevance) parts.push(`<p><b>Relevance:</b> ${esc(a.relevance)}</p>`);
  if (a.duplicates?.length) parts.push(`<p><b>Duplicates:</b></p><table>${a.duplicates.map((d) =>
    `<tr><td>${esc(d.coverage)}</td><td><code>${esc(d.path)}</code></td><td>${esc(d.note)}</td></tr>`).join("")}</table>`);
  if (a.origin) parts.push(`<p><b>Origin:</b> ${esc(a.origin.date)} <code>${esc(a.origin.sha?.slice(0, 8))}</code>` +
    `${a.origin.pr ? ` <a href="${DTEST}/pull/${a.origin.pr}">#${a.origin.pr}</a>` : ""} — ${esc(a.origin.summary)}</p>`);
  parts.push(`<p><b>Jenkins</b> <span class="muted">(dtest-release, last 20 builds)</span>: ${t.stats.runs} runs, ` +
    `${t.stats.pass_rate}% pass, avg ${fmtS(t.stats.avg_s)}</p>`);
  const params = Object.entries(t.params || {});
  if (params.length) parts.push(`<details><summary>${params.length} params</summary><table>` +
    params.map(([p, s]) => `<tr><td><code>${esc(p)}</code></td><td class="n">${s.runs} runs</td><td class="n">${s.pass_rate}%</td><td class="n">${fmtS(s.avg_s)}</td></tr>`).join("") +
    `</table></details>`);
  parts.push(`<p><b>Commits</b> touching the test (newest first):</p><table>${t.commits.map((c) => commitRow(c, byPrefix(c.sha))).join("")}</table>`);
  if (extra.length) parts.push(`<p><b>File-level commits</b> affecting it:</p><table>${extra.map((c) => commitRow(c, byPrefix(c.sha))).join("")}</table>`);
  return `<div class="test">${parts.join("")}</div>`;
}

function render(files) {
  const root = document.getElementById("root");
  const all = files.flatMap((f) => f.tests);
  const total = counts(all);
  document.getElementById("meta").textContent =
    `${files.length} files, ${all.length} tests — GREEN ${total.G}, YELLOW ${total.Y}, RED ${total.R}, GRAY ${total.X}`;
  for (const f of files) {
    const fd = el(`<details><summary><span class="row"><span><b>${esc(f.file)}</b></span>${countCells(counts(f.tests), f.tests.length)}</span></summary></details>`);
    const classes = [...new Set(f.tests.map((t) => t.class))];
    for (const cls of classes) {
      const ts = f.tests.filter((t) => t.class === cls);
      const cd = el(`<details><summary><span class="row"><span>${esc(cls)}</span>${countCells(counts(ts), ts.length)}</span></summary></details>`);
      for (const t of ts) {
        const td = el(`<details><summary><span class="badge b${t.color}">${t.decision || "GRAY"}</span>${esc(t.name)}` +
          `<span class="stats muted">${t.stats.pass_rate}% · ${fmtS(t.stats.avg_s)}</span></summary></details>`);
        td.addEventListener("toggle", () => { if (td.open && td.children.length === 1) td.append(el(testBody(t, f.file_commits))); });
        cd.append(td);
      }
      fd.append(cd);
    }
    root.append(fd);
  }
}

(async () => {
  const mods = await getJSON("data/index.json");
  const files = await Promise.all(mods.map(async (m) => {
    const [data, analysis, decisions] = await Promise.all(
      [getJSON(`data/${m}.json`), getJSON(`analysis/${m}.json`), getJSON(`decisions/${m}.json`)]);
    for (const t of data.tests) {
      const key = `${t.class}::${t.name}`;
      t.analysis = analysis?.tests?.[key];
      t.override = decisions?.[key];
      t.decision = t.override?.decision || t.analysis?.decision;
      t.color = COLORS[t.decision] || "X";
    }
    return data;
  }));
  render(files);
})().catch((e) => { document.getElementById("meta").textContent = `error: ${e}`; });
</script>
</body>
</html>
